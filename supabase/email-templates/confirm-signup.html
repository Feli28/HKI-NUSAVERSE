<!-- Supabase > Authentication > Emails > Templates > "Confirm sign up"
     Subject: Verify your NusaVerse email -->
<div style="background:#FFF8EF;padding:32px 16px;font-family:Poppins,Arial,sans-serif;">
  <div style="max-width:420px;margin:0 auto;">
    <h1 style="margin:0 0 4px;font-size:22px;letter-spacing:1px;color:#582E24;">NUSAVERSE</h1>
    <p style="margin:0 0 24px;font-size:11px;letter-spacing:4px;color:#582E24;">SINCE 2026</p>

    <h2 style="margin:0 0 12px;font-size:22px;color:#5B2625;">Verify your email</h2>
    <p style="margin:0 0 24px;font-size:14px;line-height:1.6;color:#4A2420;">
      Thanks for signing up! Tap the button below to verify your email address.
      This link is valid for 30 minutes.
    </p>

    <p style="margin:0 0 24px;">
      <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email"
         style="display:inline-block;background:#D97963;color:#ffffff;text-decoration:none;
                padding:12px 28px;border-radius:8px;font-size:15px;">Verify Email</a>
    </p>

    <p style="margin:0;font-size:12px;line-height:1.6;color:#7A5B55;">
      If you didn't create a NusaVerse account, you can safely ignore this email.
    </p>
  </div>
</div>
